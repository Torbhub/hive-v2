name: no-silent-red
# Watches the deploy workflow on main. A red gate on the tip spawns a revert
# PR, gates it on its branch, squash-merges it, and dispatches the deploy on
# main. A red deploy leg with a green gate alarms only — infra failures are
# not content to revert. One rolling issue carries the alarm. Operator steps:
# docs/no-silent-red.md.
#
# GITHUB_TOKEN acts (branch push, PR create, merge) fire no other workflows.
# So the tripwire runs the gate by dispatching deploy on the revert branch
# (its deploy leg is main-only) and dispatches the deploy on main itself
# after merging.
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]

# One tripwire per offending SHA — a rerun of the same failed run must not double-act.
concurrency:
  group: no-silent-red-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write       # push the revert branch, merge the PR
  pull-requests: write  # open and comment the revert PR
  issues: write         # the rolling alarm issue
  checks: read          # poll the gate check on the revert head
  actions: write        # dispatch deploy on the revert branch and on main

jobs:
  red-check:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate and auto-revert the red tip
        id: act
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TIP="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [ "$RUN_SHA" != "$TIP" ]; then
            echo "failed SHA ${RUN_SHA:0:7} is no longer main tip (${TIP:0:7}) — the tip's own checks govern. No-op."
            echo "outcome=superseded" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Split on the job named `gate` in deploy.yml: red gate is content,
          # red deploy leg with a green gate is infra.
          GATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "gate") | .conclusion')"
          if [ "$GATE" != "failure" ]; then
            echo "gate conclusion is ${GATE:-unknown}, not failure — the deploy leg failed, not the content. Alarm-only."
            echo "outcome=deploy-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Loop guard: never auto-revert our own revert PR (alarm stays, human resolves).
          SUBJ="$(git log -1 --format=%s "$TIP")"
          if [[ "$SUBJ" == Revert\ \"* ]]; then
            echo "::warning::tip $TIP is itself a revert — alarm-only, no auto-revert"
            echo "outcome=loop-guarded" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Dedupe: an unmerged revert PR for this SHA already exists (open, or
          # closed without merge — a rerun must not spawn it again).
          EXISTING="$(gh pr list --state all --limit 100 --json number,title,state --jq ".[] | select(.state != \"MERGED\") | select(.title | test(\"no-silent-red ${TIP:0:7}\")) | .number" | head -1)"
          if [ -n "$EXISTING" ]; then
            echo "revert PR #$EXISTING already exists for ${TIP:0:7} — no-op"
            echo "outcome=deduped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="auto-revert/${TIP:0:7}"
          git checkout -b "$BRANCH" "$TIP"
          if ! git revert -m 1 --no-edit "$TIP"; then
            git revert --abort || true
            if ! git revert --no-edit "$TIP"; then
              git revert --abort || true
              echo "::error::revert of $TIP conflicts — human must resolve"
              echo "outcome=conflict" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git push origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "Revert \"$SUBJ\" — no-silent-red ${TIP:0:7}" \
            --body "The gate went red on main at $TIP ([run]($RUN_URL)). This revert restores the last green tree. The tripwire gates this PR on its branch, squash-merges it when green, and dispatches the deploy on main. If the gate stays red, a human resolves — the no-silent-red alarm stays open.")"
          echo "revert PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          # GITHUB_TOKEN fired no checks for this PR, so run the gate by hand:
          # dispatch deploy on the branch (deploy leg is main-only) and poll
          # the check it writes on the revert head.
          REVERT_SHA="$(git rev-parse HEAD)"
          gh workflow run deploy.yml --ref "$BRANCH"
          C="pending"
          for i in $(seq 1 60); do
            sleep 10
            C="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REVERT_SHA/check-runs?check_name=gate" --jq '.check_runs[0].conclusion // "pending"')"
            case "$C" in
              success) break ;;
              failure|cancelled|timed_out|action_required) break ;;
            esac
          done
          if [ "$C" != "success" ]; then
            echo "::error::gate on the revert branch did not go green within 10 minutes (conclusion: $C) — human resolves $PR_URL"
            echo "outcome=revert-gate-red" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Squash, so the merged tip keeps the Revert "..." subject the loop
          # guard above matches (and main stays all-squash).
          gh pr merge --squash "$PR_URL"
          # The GITHUB_TOKEN merge fires no push run — dispatch the deploy on main by hand.
          gh workflow run deploy.yml --ref main
          echo "outcome=revert-merged" >> "$GITHUB_OUTPUT"
      - name: Alarm (always — even when the revert path failed)
        if: >-
          ${{
            always()
            && !contains(fromJSON('["superseded","deduped"]'), steps.act.outputs.outcome)
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          OUTCOME: ${{ steps.act.outputs.outcome }}
          PR_URL: ${{ steps.act.outputs.pr_url }}
        run: |
          set -euo pipefail
          [ -n "$RUN_SHA" ] || exit 0
          gh label create no-silent-red --color B60205 --description "main red tripwire" --force
          BODY=$(printf 'The deploy workflow failed on main at `%s` ([run](%s)). Tripwire outcome: **%s**.\n\n- revert PR: %s\n- policy: any failure is immediately fixed; this issue closes when main is green again.' \
            "${RUN_SHA:0:7}" "$RUN_URL" "${OUTCOME:-act-step-failed}" "${PR_URL:-none}")
          EXISTING="$(gh issue list --label no-silent-red --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "NO-SILENT-RED: main red at ${RUN_SHA:0:7}" --label no-silent-red --assignee tehalexf --body "$BODY"
          fi
          echo "::error::no-silent-red: deploy failed on main at ${RUN_SHA:0:7} (outcome: ${OUTCOME:-act-step-failed})"
          # Also comment on the offending PR so its author sees the revert.
          PR_NUM="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RUN_SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)"
          [ -n "$PR_NUM" ] && gh pr comment "$PR_NUM" --body "This merge turned main red ([run]($RUN_URL)). no-silent-red tripwire outcome: ${OUTCOME:-act-step-failed}. ${PR_URL:+Revert: $PR_URL}" || true
