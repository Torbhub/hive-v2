name: bench

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full 40-character reviewed main commit
        required: true
        type: string

permissions: {}

concurrency:
  group: bench-main
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: role-bench
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Verify the exact reviewed main commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA" ]
          git cat-file -e "${EXPECTED_MAIN_SHA}^{commit}"
          MAIN_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [ "$MAIN_HEAD" = "$EXPECTED_MAIN_SHA" ]
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Assume the port-forward-only bench role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.HIVE_BENCH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Open the teamkimi tunnel over SSM
        env:
          INSTANCE_ID: ${{ vars.KIMI_BOX_ID }}
        run: |
          set -euo pipefail
          if ! command -v session-manager-plugin >/dev/null; then
            echo "::error::session-manager-plugin is missing on this runner"
            exit 1
          fi
          aws ssm start-session --target "$INSTANCE_ID" \
            --document-name AWS-StartPortForwardingSession \
            --parameters '{"portNumber":["3466"],"localPortNumber":["3466"]}' \
            > /tmp/hive-bench-tunnel.log 2>&1 &
          echo $! > /tmp/hive-bench-tunnel.pid
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3466) 2>/dev/null; then
              echo "tunnel up after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the teamkimi tunnel never came up"
          tail -40 /tmp/hive-bench-tunnel.log
          exit 1
      - name: Run every role from reviewed main
        env:
          KIMI_MODEL_PROVIDER_TYPE: openai
          KIMI_MODEL_BASE_URL: http://127.0.0.1:3466/v1
          KIMI_MODEL_API_KEY: ${{ secrets.TEAMKIMI_PROXY_KEY }}
          KIMI_MODEL_NAME: ${{ vars.KIMI_BENCH_MODEL || 'kimi-k2' }}
          KIMI_CODE_NO_AUTO_UPDATE: "1"
          KIMI_CODE_TRUST_WORKSPACE: "1"
        run: |
          set -uo pipefail
          if [ -z "${KIMI_MODEL_API_KEY:-}" ]; then
            echo "::error::role-bench environment secret TEAMKIMI_PROXY_KEY is not provisioned"
            exit 1
          fi
          if ! npm install -g @moonshot-ai/kimi-code@2.3.0 --no-audit --no-fund --ignore-scripts; then
            echo "::error::kimi CLI install failed"
            exit 1
          fi
          if ! kimi --version; then
            echo "::error::kimi CLI not runnable after install"
            exit 1
          fi
          OUT="$(mktemp)"; : > "$OUT"
          EXPECTED=0; RC=0
          for role in roles/*; do
            [ -f "$role" ] || continue
            for task in bench/tasks/*/; do
              EXPECTED=$((EXPECTED + 1))
              PROMPT="$(mktemp)"
              { cat "$role"; echo; cat "$task/prompt.md"; } > "$PROMPT"
              echo "=== bench: role=$role task=$(basename "$task")"
              timeout 1500 bash bench/run.sh "$task" kimi -p "$(cat "$PROMPT")" >> "$OUT" || RC=1
              rm -f "$PROMPT"
            done
          done
          cat "$OUT"
          TOTAL="$(wc -l < "$OUT")"
          PASSN="$(grep -c '"verdict":"pass"' "$OUT" || true)"
          if [ "$RC" = 0 ] && [ "$TOTAL" = "$EXPECTED" ]; then
            echo "bench verdict: PASS ($PASSN/$TOTAL)"
          else
            echo "bench verdict: FAIL ($PASSN/$TOTAL passed, $EXPECTED expected)"
          fi
          [ "$RC" = 0 ] && [ "$TOTAL" = "$EXPECTED" ]
      - name: Close the tunnel
        if: always()
        run: |
          if [ -f /tmp/hive-bench-tunnel.pid ]; then
            kill "$(cat /tmp/hive-bench-tunnel.pid)" 2>/dev/null || true
          fi
