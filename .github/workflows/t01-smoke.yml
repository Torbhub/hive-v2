name: t01-smoke

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Explicit preflight, count-only, or paid matrix scenario
        required: true
        type: choice
        options: [preflight, count, matrix]
      matrix:
        description: Explicit paid matrix selection
        required: true
        type: choice
        options: [none, full]
      paid_admission:
        description: Paid admission requires the exact reviewed full-matrix inputs
        required: true
        default: false
        type: boolean
      max_input_tokens:
        description: Input-token cap for each invocation, maximum 16000
        required: true
        type: string
      max_output_tokens:
        description: Output-token cap for each invocation, maximum 2000
        required: true
        type: string
      max_reasoning_tokens:
        description: Reasoning-token cap for each invocation, maximum 4000
        required: true
        type: string
      max_total_tokens:
        description: Scenario cap up to 22000, or exactly 132000 for the full matrix
        required: true
        type: string
      max_api_calls:
        description: Scenario cap up to 1, or exactly 12 for the full matrix
        required: true
        type: string
      max_estimated_cost_usd:
        description: Scenario cap up to 0.50, or exactly 5 for the full matrix
        required: true
        type: string
      max_paid_admissions:
        description: Zero for preflight and count, exactly 12 for the full matrix
        required: true
        type: string
      lifetime_minutes:
        description: Instance lifetime from 5 through 120 minutes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: t01-smoke
  cancel-in-progress: false

jobs:
  preflight:
    environment: t01-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DEPLOY_MUTEX_WAIT_SECONDS: 3600
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - if: inputs.scenario == 'matrix'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: inputs.scenario == 'matrix'
        name: Build only the locked evidence runner
        run: npm ci --ignore-scripts && node ./node_modules/typescript/bin/tsc -p tools/hermes-live/tsconfig.json
      - name: Validate the reviewed dispatch contract before AWS access
        id: validate
        env:
          T01_TEAMKIMI_HOST_ID: ${{ vars.KIMI_BOX_ID }}
          EXPECTED_POLICY_HASH: ${{ vars.T01_EXPECTED_POLICY_HASH }}
          PRICING_ATTESTATION: ${{ vars.T01_PRICING_ATTESTATION }}
          SCENARIO: ${{ inputs.scenario }}
          MATRIX: ${{ inputs.matrix }}
          PAID_ADMISSION: ${{ inputs.paid_admission }}
          MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
          MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
          MAX_REASONING_TOKENS: ${{ inputs.max_reasoning_tokens }}
          MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
          MAX_API_CALLS: ${{ inputs.max_api_calls }}
          MAX_ESTIMATED_COST_USD: ${{ inputs.max_estimated_cost_usd }}
          MAX_PAID_ADMISSIONS: ${{ inputs.max_paid_admissions }}
          LIFETIME_MINUTES: ${{ inputs.lifetime_minutes }}
        run: bash infra/t01-smoke/workflow.sh validate-inputs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_T01_SMOKE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 9000
      - name: Acquire the fleet deploy mutex
        id: acquire
        run: bash infra/t01-smoke/workflow.sh acquire
      - name: Switch to the deploy role only for count host start
        if: inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: Start only the run-scoped count listener
        if: inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        id: count_start
        env:
          SCENARIO: ${{ inputs.scenario }}
          T01_TEAMKIMI_HOST_ID: ${{ vars.KIMI_BOX_ID }}
        run: bash infra/t01-smoke/workflow.sh count-start
      - name: Restore the T01 smoke role after count host start
        if: always() && inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_T01_SMOKE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 9000
      - name: Issue the expiring no-spend health credential
        id: health
        env:
          T01_HEALTH_ATTESTATION: ${{ vars.T01_HEALTH_ATTESTATION }}
          LIFETIME_MINUTES: ${{ inputs.lifetime_minutes }}
        run: bash infra/t01-smoke/workflow.sh issue-health-credential
      - name: Issue the run-scoped TeamKimi control credential
        id: proxy
        if: inputs.scenario == 'matrix'
        env:
          TEAMKIMI_PROXY_KEY: ${{ secrets.TEAMKIMI_PROXY_KEY }}
        run: bash infra/t01-smoke/workflow.sh issue-proxy-credential
      - name: Create the disposable preflight stack
        id: deploy
        env:
          TEAMKIMI_PROXY_SECRET_ARN: ${{ steps.proxy.outputs.arn }}
          VPC_ID: ${{ vars.T01_VPC_ID }}
          SUBNET_ID: ${{ vars.T01_SUBNET_ID }}
          RESOLVER_IP: ${{ vars.T01_RESOLVER_IP }}
          AMI_ID: ${{ vars.T01_AMI_ID }}
          T01_TEAMKIMI_HOST_ID: ${{ vars.KIMI_BOX_ID }}
          EXPECTED_POLICY_HASH: ${{ vars.T01_EXPECTED_POLICY_HASH }}
          PRICING_ATTESTATION: ${{ vars.T01_PRICING_ATTESTATION }}
          SCENARIO: ${{ inputs.scenario }}
          MATRIX: ${{ inputs.matrix }}
          PAID_ADMISSION: ${{ inputs.paid_admission }}
          MAX_INPUT_TOKENS: ${{ inputs.max_input_tokens }}
          MAX_OUTPUT_TOKENS: ${{ inputs.max_output_tokens }}
          MAX_REASONING_TOKENS: ${{ inputs.max_reasoning_tokens }}
          MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
          MAX_API_CALLS: ${{ inputs.max_api_calls }}
          MAX_ESTIMATED_COST_USD: ${{ inputs.max_estimated_cost_usd }}
          MAX_PAID_ADMISSIONS: ${{ inputs.max_paid_admissions }}
          LIFETIME_MINUTES: ${{ inputs.lifetime_minutes }}
        run: bash infra/t01-smoke/workflow.sh deploy
      - name: Switch to the deploy role only for host health attestation
        if: steps.acquire.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: Collect fresh host health attestation
        id: host_attestation
        if: steps.acquire.outcome == 'success'
        env:
          T01_TEAMKIMI_HOST_ID: ${{ vars.KIMI_BOX_ID }}
        run: bash infra/t01-smoke/workflow.sh refresh-host-attestation
      - name: Restore the T01 smoke role after host health attestation
        if: always() && steps.acquire.outcome == 'success' && steps.deploy.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_T01_SMOKE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 9000
      - name: Refresh the expiring no-spend health credential
        id: health_refresh
        if: steps.acquire.outcome == 'success'
        env:
          T01_HEALTH_ATTESTATION: ${{ steps.host_attestation.outputs.attestation }}
        run: bash infra/t01-smoke/workflow.sh refresh-health-credential
      - name: Collect only sanitized preflight evidence
        id: collect
        continue-on-error: true
        env:
          LIFETIME_MINUTES: ${{ inputs.lifetime_minutes }}
          EXPECTED_POLICY_HASH: ${{ vars.T01_EXPECTED_POLICY_HASH }}
          PRICING_ATTESTATION: ${{ vars.T01_PRICING_ATTESTATION }}
          SCENARIO: ${{ inputs.scenario }}
        run: bash infra/t01-smoke/workflow.sh collect
      - name: Switch to the deploy role only for count host stop
        if: always() && inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600
      - name: Stop only the run-scoped count listener
        if: always() && inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        id: count_stop
        continue-on-error: true
        env:
          SCENARIO: ${{ inputs.scenario }}
          T01_TEAMKIMI_HOST_ID: ${{ vars.KIMI_BOX_ID }}
        run: bash infra/t01-smoke/workflow.sh count-stop
      - name: Restore the T01 smoke role after count host stop
        if: always() && inputs.scenario == 'count' && steps.acquire.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_T01_SMOKE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 9000
      - name: Retain reviewed evidence for seven days
        id: upload
        if: always() && steps.acquire.outcome == 'success' && (steps.collect.outcome != 'skipped' || inputs.scenario == 'count')
        uses: actions/upload-artifact@v4
        with:
          name: t01-preflight-${{ github.run_id }}
          path: |
            t01-evidence/preflight.jsonl
            t01-evidence/count-host.jsonl
            t01-evidence/export
          if-no-files-found: error
          retention-days: 7
      - name: Delete the stack and run secrets, then release the fleet deploy mutex
        if: always() && steps.acquire.outcome == 'success'
        env:
          SCENARIO: ${{ inputs.scenario }}
          PAID_EVIDENCE_VERIFIED: ${{ steps.collect.outcome == 'success' && steps.upload.outcome == 'success' && 'yes' || 'no' }}
          T01_COUNT_STOP_VERIFIED: ${{ steps.count_stop.outcome == 'success' && 'yes' || 'no' }}
        run: bash infra/t01-smoke/workflow.sh cleanup
      - name: Fail after evidence and cleanup finish
        if: always() && (steps.collect.outcome == 'failure' || steps.upload.outcome == 'failure' || steps.count_start.outcome == 'failure' || steps.count_stop.outcome == 'failure')
        run: exit 1
