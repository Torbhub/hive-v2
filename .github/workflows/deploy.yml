name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'infra/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gate-{0}', github.ref) || 'deploy-hive-v2' }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c
        with:
          tool: jj-cli
      - run: npm test
      - run: npm run build
      - name: Discipline ratchet — god-file line counts
        run: node scripts/discipline-gate.mjs
      - name: Check the trusted gate workflow
        run: python3 test/deploy_workflow_checks.py
      - name: Check the memory LLM forwarder
        run: python3 test/llm_forward_checks.py
      - name: Check bench credential isolation
        run: python3 test/bench_workflow_checks.py
      - name: Check the shrink-anything approval workflow
        run: python3 test/shrink_anything_workflow_checks.py
      - name: Syntax-check the infra scripts
        run: bash -n infra/provision-box.sh && bash -n infra/deploy-box.sh && bash -n infra/deploy-mutex.sh
      - name: Check T01 policy and behavior
        run: |
          python3 test/t01_policy_checks.py
          python3 test/t01_runtime_checks.py
          python3 test/t01_workflow_checks.py
          python3 test/t01_lifecycle_checks.py
          python3 test/t01_health_broker_checks.py
      - name: Lint the CloudFormation templates
        run: |
          pipx install cfn-lint
          cfn-lint infra/template.yaml infra/t01-smoke/template.yaml

  deploy:
    needs: gate
    if: >-
      ${{ github.event_name == 'push'
         || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_MUTEX_WAIT_SECONDS: 2700
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Skip a superseded push run
        id: staleness
        if: ${{ github.event_name == 'push' }}
        run: |
          MAIN_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ -n "$MAIN_HEAD" ] || { echo "::error::could not read main HEAD from origin"; exit 1; }
          if [ "$MAIN_HEAD" = "${{ github.sha }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=100 origin "$MAIN_HEAD" || { echo "::error::could not fetch main HEAD $MAIN_HEAD for the supersede diff"; exit 1; }
          DIFF="$(git diff --name-only "${{ github.sha }}" "$MAIN_HEAD")" || { echo "::error::could not diff — refusing to guess skip or deploy"; exit 1; }
          if echo "$DIFF" | grep -qE '^(src/|web/|infra/|\.github/workflows/deploy\.yml|package[^/]*\.json|tsconfig[^/]*\.json)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD $MAIN_HEAD supersedes ${{ github.sha }} and touches a deploy path — this run skips (the newer head fires its own run)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD $MAIN_HEAD moved past ${{ github.sha }} but touches no deploy path — this run is the last deploy carrier and deploys"
          fi
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update the infra stack when infra/ changed
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- infra/)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- infra/ 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "infra/ unchanged; skipping stack update"
            exit 0
          fi
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name hive-v2-infra \
            --query 'Stacks[0].StackStatus' --output text)
          if [ "$STACK_STATUS" = "UPDATE_ROLLBACK_FAILED" ]; then
            aws cloudformation continue-update-rollback --stack-name hive-v2-infra
            aws cloudformation wait stack-rollback-complete --stack-name hive-v2-infra
          fi
          aws cloudformation deploy \
            --stack-name hive-v2-infra \
            --template-file infra/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM
      - name: Acquire the deploy mutex
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        run: bash infra/deploy-mutex.sh acquire aws-acts "hive-v2/${{ github.run_id }}"
      - name: Deploy to the box over SSM
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        env:
          INSTANCE_ID: ${{ vars.KIMI_BOX_ID }}
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hive-v2 deploy $SHA" \
            --parameters "commands=[\"cd /home/ubuntu/hive-v2 && bash infra/deploy-box.sh $SHA\"]" \
            --query 'Command.CommandId' --output text)
          echo "command id: $COMMAND_ID"
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success)
                echo "deploy succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "deploy failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text | tail -40
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -40
                exit 1
                ;;
            esac
          done
          echo "deploy did not reach a terminal state within 10 minutes"
          exit 1
      - name: Release the deploy mutex
        if: always() && steps.staleness.outputs.skip != 'true'
        run: bash infra/deploy-mutex.sh release aws-acts "hive-v2/${{ github.run_id }}"
