name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'infra/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # Newest-wins, same as citadel's deploy-nexus: a newer push cancels the
  # stale run, and the staleness step below keeps a survivor from reverting
  # the box to an older SHA. A cancelled run reads as normal, not an incident.
  group: deploy-hive-v2
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Syntax-check the infra scripts
        run: bash -n infra/provision-box.sh && bash -n infra/deploy-box.sh
      - name: Lint the CloudFormation template
        run: |
          pipx install cfn-lint
          cfn-lint infra/template.yaml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip a superseded push run
        id: staleness
        # When main moves past this run's SHA, skip the deploy only if the
        # newer head fires its own deploy run (citadel issue #1811: a merge
        # that touches no trigger path fires no run, so the older run is the
        # last deploy carrier and must NOT skip). Dispatches never skip. A
        # diff that fails to compute fails the step loudly. Never guess.
        if: ${{ github.event_name == 'push' }}
        run: |
          MAIN_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ -n "$MAIN_HEAD" ] || { echo "::error::could not read main HEAD from origin"; exit 1; }
          if [ "$MAIN_HEAD" = "${{ github.sha }}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=100 origin "$MAIN_HEAD" || { echo "::error::could not fetch main HEAD $MAIN_HEAD for the supersede diff"; exit 1; }
          DIFF="$(git diff --name-only "${{ github.sha }}" "$MAIN_HEAD")" || { echo "::error::could not diff — refusing to guess skip or deploy"; exit 1; }
          # Deploy trigger paths, one regex branch per on.push.paths entry:
          #   src/ web/ infra/  <- src/** web/** infra/**
          #   package[^/]*\.json  tsconfig[^/]*\.json  <- package*.json tsconfig*.json
          #   \.github/workflows/deploy\.yml  <- .github/workflows/deploy.yml
          if echo "$DIFF" | grep -qE '^(src/|web/|infra/|\.github/workflows/deploy\.yml|package[^/]*\.json|tsconfig[^/]*\.json)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD $MAIN_HEAD supersedes ${{ github.sha }} and touches a deploy path — this run skips (the newer head fires its own run)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD $MAIN_HEAD moved past ${{ github.sha }} but touches no deploy path — this run is the last deploy carrier and deploys"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update the infra stack when infra/ changed
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        # Stack deploys are exempt from the mutex: CloudFormation serializes
        # per-stack, and this step is what grants the role its mutex access.
        env:
          HIVE_BASIC_AUTH_PASSWORD: ${{ secrets.HIVE_BASIC_AUTH_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- infra/)
          else
            # dispatch: no before-sha; a missing HEAD~1 means skip-with-log below
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- infra/ 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "infra/ unchanged; skipping stack update"
            exit 0
          fi
          echo "::add-mask::$HIVE_BASIC_AUTH_PASSWORD"
          aws cloudformation deploy \
            --stack-name hive-v2-infra \
            --template-file infra/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides HiveBasicAuthPassword="$HIVE_BASIC_AUTH_PASSWORD"
      - name: Acquire the deploy mutex
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        run: bash infra/deploy-mutex.sh acquire aws-acts "hive-v2/${{ github.run_id }}"
      - name: Deploy to the box over SSM
        if: ${{ steps.staleness.outputs.skip != 'true' }}
        env:
          INSTANCE_ID: ${{ vars.KIMI_BOX_ID }}
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hive-v2 deploy $SHA" \
            --parameters "commands=[\"cd /home/ubuntu/hive-v2 && bash infra/deploy-box.sh $SHA\"]" \
            --query 'Command.CommandId' --output text)
          echo "command id: $COMMAND_ID"
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success)
                echo "deploy succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "deploy failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text | tail -40
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -40
                exit 1
                ;;
            esac
          done
          echo "deploy did not reach a terminal state within 10 minutes"
          exit 1
      - name: Release the deploy mutex
        # always() so a failed or cancelled deploy frees the lock; releasing a
        # mutex this run never took is a no-op warn inside the script.
        if: always() && steps.staleness.outputs.skip != 'true'
        run: bash infra/deploy-mutex.sh release aws-acts "hive-v2/${{ github.run_id }}"
