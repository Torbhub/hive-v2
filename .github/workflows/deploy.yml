name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'infra/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hive-v2
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Syntax-check the infra scripts
        run: bash -n infra/provision-box.sh && bash -n infra/deploy-box.sh
      - name: Lint the CloudFormation template
        run: |
          pipx install cfn-lint
          cfn-lint infra/template.yaml

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.HIVE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Update the infra stack when infra/ changed
        env:
          HIVE_BASIC_AUTH_PASSWORD: ${{ secrets.HIVE_BASIC_AUTH_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- infra/)
          else
            # dispatch: no before-sha; a missing HEAD~1 means skip-with-log below
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- infra/ 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "infra/ unchanged; skipping stack update"
            exit 0
          fi
          echo "::add-mask::$HIVE_BASIC_AUTH_PASSWORD"
          aws cloudformation deploy \
            --stack-name hive-v2-infra \
            --template-file infra/template.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides HiveBasicAuthPassword="$HIVE_BASIC_AUTH_PASSWORD"
      - name: Deploy to the box over SSM
        env:
          INSTANCE_ID: ${{ vars.KIMI_BOX_ID }}
          SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hive-v2 deploy $SHA" \
            --parameters "commands=[\"cd /home/ubuntu/hive-v2 && bash infra/deploy-box.sh $SHA\"]" \
            --query 'Command.CommandId' --output text)
          echo "command id: $COMMAND_ID"
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)
            echo "poll $i: $STATUS"
            case "$STATUS" in
              Success)
                echo "deploy succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "deploy failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text | tail -40
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -40
                exit 1
                ;;
            esac
          done
          echo "deploy did not reach a terminal state within 10 minutes"
          exit 1
