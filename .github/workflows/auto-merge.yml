name: auto-merge
# Tiered auto-merge, ported from citadel with hive-v2 scopes.
#
# A PR auto-merges when every shared gate holds and ONE tier admits it.
# Shared gates:
#   1. no `gate:*` label (the human-hold mechanism);
#   2. the latest deploy run on main is green — a red deploy line halts
#      auto-merge fail-closed;
#   3. the required `gate` check is green — enforced by GitHub's auto-merge
#      itself.
# Tiers:
#   A. prose — label `auto-merge`, and every changed file is in the
#      allowlist (docs/, roles/, rules/, skills/, README.md, AGENTS.md).
#      infra/ and src/ are hard-denied even if the allowlist is ever
#      widened.
#   B. deslop-clean — label `deslop-clean`, applied by the on-box
#      adversarial reviewer only after a full deslop review comes back
#      CLEAN (and pulled on SLOPPY). Any path is allowed EXCEPT infra/**
#      and .github/**: those stay human-territory even with the label,
#      because machinery that can merge its own edits is a supply-chain
#      hole.
#
# The merge runs under GITHUB_TOKEN, which does not trigger push workflows.
# Tier A touches no deploy path (see deploy.yml on.push.paths), so it never
# strands a deploy. Tier B can merge src/ or web/ changes: those deploy on
# the next push to main that fires deploy.yml, not on the merge itself.
# This workflow checks out and runs NO repository code — pure API
# classification.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Classify and enable (or hold) auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout on purpose — gh needs the repo named explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR="$(jq -r .pull_request.number "$GITHUB_EVENT_PATH")"
          else
            PR="$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          fi
          [ -n "${PR:-}" ] && [ "$PR" != "null" ] || { echo "no PR associated with this event — skip"; exit 0; }

          STATE="$(gh pr view "$PR" --json state,isDraft --jq '"\(.state)/\(.isDraft)"')"
          [ "$STATE" = "OPEN/false" ] || { echo "PR #$PR is $STATE — skip"; exit 0; }

          LABELS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.labels[].name] | join(" ")')"
          HAS_PROSE=0; HAS_DESLOP=0
          case " $LABELS " in *" auto-merge "*) HAS_PROSE=1;; esac
          case " $LABELS " in *" deslop-clean "*) HAS_DESLOP=1;; esac
          if [ "$HAS_PROSE" = 0 ] && [ "$HAS_DESLOP" = 0 ]; then
            gh pr merge --disable-auto "$PR" || true
            echo "PR #$PR: no auto-merge or deslop-clean label — skip (opt-in)"
            exit 0
          fi
          GATE_LABEL="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.labels[].name | select(startswith("gate:"))] | .[0] // empty')"
          DEPLOY_GREEN="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&per_page=1" --jq 'if .workflow_runs[0].conclusion == "success" then "yes" else "no" end')"

          PROSE_OK=1; PROSE_DENY=0; DESLOP_DENY=0
          while IFS= read -r f; do
            case "$f" in
              docs/*|roles/*|rules/*|skills/*|README.md|AGENTS.md) ;;
              *) PROSE_OK=0;;
            esac
            case "$f" in
              infra/*|src/*) PROSE_DENY=1;;
            esac
            case "$f" in
              infra/*|.github/*) DESLOP_DENY=1;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')

          TIER=
          if [ "$HAS_PROSE" = 1 ] && [ "$PROSE_OK" = 1 ] && [ "$PROSE_DENY" = 0 ]; then
            TIER="auto-merge (prose scope)"
          elif [ "$HAS_DESLOP" = 1 ] && [ "$DESLOP_DENY" = 0 ]; then
            TIER="deslop-clean (adversarial review)"
          fi

          if [ -n "$TIER" ] && [ -z "$GATE_LABEL" ] && [ "$DEPLOY_GREEN" = yes ]; then
            if gh pr merge --auto --merge "$PR"; then
              echo "PR #$PR: auto-merge ENABLED via $TIER (no gate label, deploy line green)"
            else
              echo "::warning::PR #$PR eligible ($TIER) but auto-merge enable failed (repo allow_auto_merge off?)"
            fi
            exit 0
          fi

          if [ -n "$GATE_LABEL" ]; then
            WHY="held by label $GATE_LABEL"
          elif [ "$DEPLOY_GREEN" != yes ]; then
            WHY="deploy line not green (fail-closed halt)"
          else
            [ "$HAS_PROSE" = 1 ] && [ "$PROSE_OK" = 0 ] && WHY="outside the prose allowlist"
            [ "$HAS_PROSE" = 1 ] && [ "$PROSE_DENY" = 1 ] && WHY="touches infra/ or src/ (prose hard deny)"
            [ "$HAS_DESLOP" = 1 ] && [ "$DESLOP_DENY" = 1 ] && WHY="touches infra/ or .github/ (human territory even with deslop-clean)"
          fi
          # A held PR must not keep a previously-enabled auto-merge.
          gh pr merge --disable-auto "$PR" || true
          echo "PR #$PR held: $WHY"
