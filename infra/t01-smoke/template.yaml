AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable Hermes T01 preflight instance with no ingress and a bounded lifetime

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: infra/t01-smoke/RUNBOOK.md
        has: credential boundary, no-spend workflow, evidence review, and deletion procedure
    must:
      - No paid model endpoint or automatic activation
      - Terminate the instance and delete its root volume at the bounded deadline

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  ResolverIp:
    Type: String
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
    Description: Reviewed IPv4 resolver used only during provisioning egress.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Reviewed Amazon Linux 2023 x86_64 image for this bounded run.
  TeamKimiSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:hive-v2-t01-smoke-[A-Za-z0-9/_+=.@-]+$'
  TeamKimiProxySecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:594552273052:secret:hive-v2-t01-smoke-proxy-0
    NoEcho: true
    AllowedPattern: '^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:hive-v2-t01-smoke-proxy-[A-Za-z0-9/_+=.@-]+$'
  Scenario:
    Type: String
    AllowedValues: [preflight, count, matrix]
  Matrix:
    Type: String
    AllowedValues: [none, full]
  PaidAdmission:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
  TeamKimiHostId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^i-[0-9a-f]{8,17}$'
  ExpectedPolicyHash:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9a-f]{64}$'
  PricingAttestationBase64:
    Type: String
    Default: ''
    NoEcho: true
    AllowedPattern: '^$|^[A-Za-z0-9+/]+={0,2}$'
  RunnerArchiveUrl:
    Type: String
    AllowedPattern: '^https://codeload.github.com/Torbhub/hive-v2/tar.gz/[0-9a-f]{40}$'
  RunnerArchiveSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  MaxInputTokens:
    Type: Number
    MinValue: 0
    MaxValue: 16000
  MaxOutputTokens:
    Type: Number
    MinValue: 0
    MaxValue: 2000
  MaxReasoningTokens:
    Type: Number
    MinValue: 0
    MaxValue: 4000
  MaxTotalTokens:
    Type: Number
    MinValue: 0
    MaxValue: 132000
  MaxApiCalls:
    Type: Number
    MinValue: 0
    MaxValue: 12
  MaxEstimatedCostUsd:
    Type: Number
    MinValue: 0
    MaxValue: 5
  MaxPaidAdmissions:
    Type: Number
    MinValue: 0
    MaxValue: 12
  LifetimeMinutes:
    Type: Number
    MinValue: 5
    MaxValue: 120
  ProvisionScriptUrl:
    Type: String
    AllowedPattern: '^https://raw.githubusercontent.com/Torbhub/hive-v2/[0-9a-f]{40}/infra/t01-smoke/provision.sh$'
  ProvisionScriptSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  RuntimeScriptUrl:
    Type: String
    AllowedPattern: '^https://raw.githubusercontent.com/Torbhub/hive-v2/[0-9a-f]{40}/infra/t01-smoke/runtime.py$'
  RuntimeScriptSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  RunId:
    Type: String
    AllowedPattern: '^[0-9]+$'

Conditions:
  Matrix: !Equals [!Ref Scenario, matrix]

Resources:
  InstanceRole:
    Metadata:
      com.aws.cloudformation.Context:
        why: run-scoped secret access and fixed TeamKimi tunnel without a broad host identity
        must:
          - Read only the configured run-scoped T01 secrets
          - Start only the reviewed tunnel to the tagged TeamKimi host
          - Grant no shell, command, or other AWS permissions
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-t01-smoke-instance
      PermissionsBoundary: arn:aws:iam::594552273052:policy/hive-v2-t01-smoke-health-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-one-teamkimi-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadTeamKimiBrokerSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TeamKimiSecretArn
              - !If
                - Matrix
                - Sid: ReadRunTeamKimiControlKey
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref TeamKimiProxySecretArn
                - !Ref AWS::NoValue
              - Sid: WriteRunEvidence
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::hive-v2-t01-evidence-594552273052/hive-v2-t01-smoke/${RunId}/*'
              - Sid: T01TeamKimiTunnelHost
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Role: nexus-kimi-session
              - Sid: T01TeamKimiTunnelDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ssm:us-east-1:594552273052:document/hive-v2-t01-teamkimi-port-forward

  InstanceProfile:
    Metadata:
      com.aws.cloudformation.Context:
        why: attach only the broker-secret role to the disposable instance
        must:
          - Contain only InstanceRole
          - Never attach a broad or shared instance profile
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: hive-v2-t01-smoke
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Metadata:
      com.aws.cloudformation.Context:
        why: deny inbound access and allow only temporary provisioning egress
        must:
          - Allow no ingress
          - Apply host default-deny egress before Hermes starts
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: hive-v2-t01-smoke
      GroupDescription: No ingress. Provisioning egress is restricted by host firewall before Hermes starts.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Sub '${ResolverIp}/32'
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Sub '${ResolverIp}/32'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Role
          Value: hive-v2-t01-smoke

  Instance:
    Metadata:
      com.aws.cloudformation.Context:
        why: fresh bounded preflight outside the shared Nexus production worker
        must:
          - Terminate at the requested lifetime and delete the encrypted root volume
          - Install Hermes before lockdown and deny every unapproved destination
          - Keep host credentials and broad instance profiles out of the environment
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: t3.large
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!GetAtt SecurityGroup.GroupId]
      IamInstanceProfile: !Ref InstanceProfile
      InstanceInitiatedShutdownBehavior: terminate
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 40
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          umask 077
          report_bootstrap_failure() {
            local status=$? category=failure
            trap - ERR
            case "$status" in 124|137) category=timeout ;; esac
            if ! grep -q '"check":"complete"' /var/lib/t01/evidence/preflight.jsonl 2>/dev/null; then
              printf 'T01_EVIDENCE {"check":"bootstrap_error","status":"failed","category":"%s:instance-bootstrap","origin":"instance-bootstrap:%s"}\n' "$category" "$status" > /dev/console
              printf 'T01_EVIDENCE {"check":"provisioning","status":"failed"}\n' > /dev/console
              printf 'T01_EVIDENCE {"check":"complete","status":"failed"}\n' > /dev/console
            fi
            exit "$status"
          }
          trap report_bootstrap_failure ERR
          PROVISION_TIMEOUT_SECONDS="$(( ${LifetimeMinutes} * 60 - 60 ))"
          shutdown -h +${LifetimeMinutes}
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-redirs 0 --connect-timeout 10 --max-time 60 \
            '${ProvisionScriptUrl}' --output /opt/t01-provision.sh
          printf '%s  %s\n' '${ProvisionScriptSha256}' /opt/t01-provision.sh | sha256sum -c -
          chmod 0700 /opt/t01-provision.sh
          export TEAMKIMI_SECRET_ARN='${TeamKimiSecretArn}'
          export TEAMKIMI_PROXY_SECRET_ARN='${TeamKimiProxySecretArn}'
          export SCENARIO='${Scenario}' MATRIX='${Matrix}' PAID_ADMISSION='${PaidAdmission}'
          export T01_TEAMKIMI_HOST_ID='${TeamKimiHostId}'
          export EXPECTED_POLICY_HASH='${ExpectedPolicyHash}'
          export PRICING_ATTESTATION_BASE64='${PricingAttestationBase64}'
          export RUNNER_ARCHIVE_URL='${RunnerArchiveUrl}'
          export RUNNER_ARCHIVE_SHA256='${RunnerArchiveSha256}'
          export T01_EVIDENCE_BUCKET='hive-v2-t01-evidence-594552273052'
          export MAX_INPUT_TOKENS='${MaxInputTokens}'
          export MAX_OUTPUT_TOKENS='${MaxOutputTokens}'
          export MAX_REASONING_TOKENS='${MaxReasoningTokens}'
          export MAX_TOTAL_TOKENS='${MaxTotalTokens}'
          export MAX_API_CALLS='${MaxApiCalls}'
          export MAX_ESTIMATED_COST_USD='${MaxEstimatedCostUsd}'
          export MAX_PAID_ADMISSIONS='${MaxPaidAdmissions}'
          export LIFETIME_MINUTES='${LifetimeMinutes}' RUN_ID='${RunId}'
          export RUNTIME_SCRIPT_URL='${RuntimeScriptUrl}'
          export RUNTIME_SCRIPT_SHA256='${RuntimeScriptSha256}'
          timeout --signal=TERM --kill-after=5s "$PROVISION_TIMEOUT_SECONDS" /opt/t01-provision.sh
      Tags:
        - Key: Name
          Value: hive-v2-t01-smoke
        - Key: Role
          Value: hive-v2-t01-smoke
        - Key: RunId
          Value: !Ref RunId

Outputs:
  InstanceId:
    Description: Disposable instance used by the evidence collector and cleanup step.
    Value: !Ref Instance
  BrokerSecretArn:
    Description: Reference to the run-scoped synthetic health secret. The value is never exposed.
    Value: !Ref TeamKimiSecretArn
  BrokerEndpoint:
    Description: Loopback-only no-model endpoint available to Hermes during preflight.
    Value: http://127.0.0.1:8765/v1
  HermesCommit:
    Description: Exact Hermes source commit installed by the verified provisioning script.
    Value: f0d94882e89ab8d4098b5bb2f166adfb9ee0a0ab
