AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable no-spend TeamKimi health attestation endpoint

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: infra/t01-smoke/RUNBOOK.md
        has: no-spend health attestation and credential revocation boundary
    must:
      - Expose only an authenticated health check
      - Hold no TeamKimi account credential or model route

Parameters:
  SecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:hive-v2-t01-smoke-health-[A-Za-z0-9/_+=.@-]+$'
  RunId:
    Type: String
    AllowedPattern: '^[0-9]+$'

Resources:
  HealthRole:
    Metadata:
      com.aws.cloudformation.Context:
        why: read only the run-scoped health credential
        must:
          - Grant no account credential or other AWS access
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-t01-broker-health
      PermissionsBoundary: arn:aws:iam::594552273052:policy/hive-v2-t01-broker-health-boundary
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-one-health-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SecretArn

  HealthFunction:
    Metadata:
      com.aws.cloudformation.Context:
        why: prove fresh no-model TeamKimi probe health to the disposable preflight
        must:
          - Authenticate every request and reject expired or cross-run credentials
          - Expose no model, discovery, forwarding, or status payloads
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: hive-v2-t01-broker-health
      Role: !GetAtt HealthRole.Arn
      Runtime: python3.13
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          SECRET_ARN: !Ref SecretArn
          RUN_ID: !Ref RunId
      Code:
        ZipFile: |
          import boto3
          import hmac
          import json
          import os
          import time

          client = boto3.client('secretsmanager')


          def reply(status):
              body = '' if status == 204 else '{"status":"unavailable"}'
              return {
                  'statusCode': status,
                  'headers': {'Cache-Control': 'no-store', 'Content-Type': 'application/json'},
                  'body': body,
              }


          def handler(event, context):
              method = event.get('requestContext', {}).get('http', {}).get('method')
              if method != 'GET' or event.get('rawPath') != '/health':
                  return reply(404)
              authorization = event.get('headers', {}).get('authorization', '')
              if not authorization.startswith('Bearer '):
                  return reply(401)
              try:
                  response = client.get_secret_value(SecretId=os.environ['SECRET_ARN'])
                  value = json.loads(response['SecretString'])
                  now = int(time.time())
                  valid_metadata = (
                      value['runId'] == os.environ['RUN_ID']
                      and type(value['activeAccounts']) is int and value['activeAccounts'] > 0
                      and type(value['healthyProbes']) is int and value['healthyProbes'] > 0
                      and value['healthyProbes'] <= value['activeAccounts']
                      and type(value['attestedAt']) is int
                      and value['attestedAt'] <= now + 60 and now - value['attestedAt'] <= 600
                      and type(value['probeFinishedAt']) is int
                      and value['probeFinishedAt'] <= now + 60 and now - value['probeFinishedAt'] <= 600
                      and value['probeFinishedAt'] <= value['attestedAt']
                      and type(value['expiresAt']) is int
                  )
                  if not valid_metadata:
                      return reply(503)
                  api_key = value['apiKey']
                  if not isinstance(api_key, str):
                      return reply(503)
                  if not hmac.compare_digest(authorization[7:], api_key):
                      return reply(401)
                  if now >= value['expiresAt']:
                      return reply(401)
              except Exception:
                  return reply(503)
              return reply(204)

  HealthUrl:
    Metadata:
      com.aws.cloudformation.Context:
        why: provide an AWS HTTPS origin without a shared hostname or certificate
        must:
          - Require application Bearer authentication on every health request
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HealthFunction.Arn
      AuthType: NONE

  HealthUrlPermission:
    Metadata:
      com.aws.cloudformation.Context:
        why: allow HTTPS invocation while the function enforces the run credential
        must:
          - Permit only Function URL invocation and no other Lambda action
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref HealthFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

Outputs:
  HealthUrl:
    Description: HTTPS origin for the run-scoped no-model health check.
    Value: !GetAtt HealthUrl.FunctionUrl
  CredentialId:
    Description: Public run identifier only. The health credential remains in Secrets Manager.
    Value: !Ref RunId
