# Rendered to /etc/hive-v2/tdai-gateway.yaml by provision-box.sh.
# __PLACEHOLDER__ values come from /etc/hive-v2/memory.env.
# Mirrors the config that upstream deploy/global-images/start-memory-core.sh
# generates; the stock image has no config and boots with skill/knowledge off.
deployMode: standalone
stateBackend: local

server:
  port: 8420
  host: 0.0.0.0

data:
  baseDir: /data/tdai-memory

llm:
  baseUrl: "__MEMORY_LLM_BASE_URL__"
  apiKey: "__MEMORY_LLM_API_KEY__"
  model: "__MEMORY_LLM_MODEL__"
  maxTokens: 32000
  timeoutMs: 300000

memory:
  promptMode: __MEMORY_PROMPT_MODE__
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
    triggerMode: current
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    provider: none

skill:
  enabled: true
  routing:
    mode: bm25
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000
