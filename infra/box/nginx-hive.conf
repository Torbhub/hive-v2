# hive-v2 hub webapp: TLS + basic-auth front for hive web :7684.
# Injects the origin-layer secret (L4); the app 403s anything without it.
# provision-box.sh sed-renders __HIVE_WEB_SECRET__ from /etc/hive-v2/web.env.
server {
    listen 443 ssl;
    server_name hive.44.192.48.70.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/hive.44.192.48.70.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hive.44.192.48.70.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic "hive-v2 hub preview";
    auth_basic_user_file /etc/nginx/webterm/.htpasswd-hive;

    location / {
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hive-Auth __HIVE_WEB_SECRET__;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
