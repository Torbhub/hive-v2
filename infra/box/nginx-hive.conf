# hive-v2 hub webapp. Two listeners:
# - 443 serves /hive/ to the nexus CloudFront origin (origin-key gated) —
#   RETIRES once the SSM relay replaces the public origin (follow-up PR).
# - 127.0.0.1:8081 is the SSM relay's target: the Lambda's port-forward
#   tunnel lands here; this injects the app secret and proxies to :7684.
# provision-box.sh sed-renders __HIVE_WEB_SECRET__ and __HIVE_ORIGIN_KEY__
# from /etc/hive-v2/web.env.
server {
    listen 443 ssl;
    server_name hive.44.192.48.70.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/hive.44.192.48.70.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hive.44.192.48.70.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /hive/ {
        set $hive_ok 0;
        if ($http_x_hive_origin = "__HIVE_ORIGIN_KEY__") { set $hive_ok 1; }
        if ($hive_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hive-Auth __HIVE_WEB_SECRET__;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / { return 404; }
}

server {
    listen 127.0.0.1:8081;

    location / {
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Hive-Auth __HIVE_WEB_SECRET__;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
