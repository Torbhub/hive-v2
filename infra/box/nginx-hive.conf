# hive-v2 hub webapp. One listener: 127.0.0.1:8081 is the SSM relay's
# target — the nexus Lambda's port-forward tunnel lands here; this injects
# the app secret and proxies to hive-web on :7684.
# provision-box.sh sed-renders __HIVE_WEB_SECRET__ from /etc/hive-v2/web.env.
server {
    listen 127.0.0.1:8081;

    location / {
        proxy_pass http://127.0.0.1:7684;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Hive-Auth __HIVE_WEB_SECRET__;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
