AWSTemplateFormatVersion: '2010-09-09'
Description: hive-v2 deploy infrastructure — basic-auth secret and GitHub OIDC deploy role

Parameters:
  HiveBasicAuthPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: >-
      Basic-auth password for the hive-v2 hub site (user alex). Must be the
      existing live password at first deploy so the running site never breaks.
  GithubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::594552273052:oidc-provider/token.actions.githubusercontent.com
    Description: ARN of the account-existing GitHub Actions OIDC provider.
  GithubSubjectPrefix:
    Type: String
    # The repo has GitHub's immutable OIDC subjects on, so the sub claim is
    # the rename-proof org-id/repo-id form, not repo:Torbhub/hive-v2.
    # Read it: gh api repos/Torbhub/hive-v2/actions/oidc/customization/sub
    Default: repo:Torbhub@272689427/hive-v2@1416391580
    Description: OIDC sub claim prefix for the hive-v2 repo (immutable-subject form).

Resources:
  HiveSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: citadel/kimi-permanent-01/hive-basicauth
      Description: Basic-auth credentials for the hive-v2 hub site (hive.44.192.48.70.sslip.io)
      SecretString: !Sub '{"username":"alex","password":"${HiveBasicAuthPassword}"}'

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-gh-deploy
      Description: Assumed by the Torbhub/hive-v2 deploy workflow via GitHub OIDC.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub '${GithubSubjectPrefix}:*'
      Policies:
        - PolicyName: hive-v2-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SsmSendCommandToKimiBox
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Role: nexus-kimi-session
              - Sid: SsmRunShellScriptDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ssm:us-east-1::document/AWS-RunShellScript
              - Sid: SsmReadBack
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Sid: CloudFormationSelfDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                Resource: arn:aws:cloudformation:us-east-1:594552273052:stack/hive-v2-infra/*
              - Sid: ManageHiveRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:UpdateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: arn:aws:iam::594552273052:role/hive-v2-*
              - Sid: ManageHiveSecret
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:UpdateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:TagResource
                  - secretsmanager:PutResourcePolicy
                Resource: arn:aws:secretsmanager:us-east-1:594552273052:secret:citadel/kimi-permanent-01/hive-basicauth*
              # The fleet-wide deploy mutex lives in citadel's nexus stack;
              # the workflow acquires it before any AWS act.
              - Sid: DeployMutex
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:us-east-1:594552273052:table/citadel-deploy-mutex

Outputs:
  DeployRoleArn:
    Description: ARN the GitHub workflow assumes (set as secret HIVE_DEPLOY_ROLE_ARN).
    Value: !GetAtt DeployRole.Arn
