AWSTemplateFormatVersion: '2010-09-09'
Description: hive-v2 deploy infrastructure — GitHub OIDC deploy role

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: infra/README.md
        has: hub deployment roles and disposable T01 role ownership
      - at: infra/t01-smoke/RUNBOOK.md
        has: protected environment and scoped T01 stack lifecycle

Parameters:
  GithubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::594552273052:oidc-provider/token.actions.githubusercontent.com
    Description: ARN of the account-existing GitHub Actions OIDC provider.
  GithubSubjectPrefix:
    Type: String
    # The repo has GitHub's immutable OIDC subjects on, so the sub claim is
    # the rename-proof org-id/repo-id form, not repo:Torbhub/hive-v2.
    # Read it: gh api repos/Torbhub/hive-v2/actions/oidc/customization/sub
    Default: repo:Torbhub@272689427/hive-v2@1416391580
    Description: OIDC sub claim prefix for the hive-v2 repo (immutable-subject form).

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-gh-deploy
      Description: Assumed by the Torbhub/hive-v2 deploy workflow via GitHub OIDC.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub '${GithubSubjectPrefix}:*'
      Policies:
        - PolicyName: hive-v2-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SsmSendCommandToKimiBox
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Role: nexus-kimi-session
              - Sid: SsmRunShellScriptDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: arn:aws:ssm:us-east-1::document/AWS-RunShellScript
              - Sid: SsmReadBack
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
              - Sid: SsmPortForwardToKimiBox
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Role: nexus-kimi-session
              - Sid: SsmPortForwardingDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ssm:us-east-1::document/AWS-StartPortForwardingSession
              - Sid: T01TeamKimiDocumentLifecycle
                Effect: Allow
                Action:
                  - ssm:CreateDocument
                  - ssm:UpdateDocument
                  - ssm:UpdateDocumentDefaultVersion
                  - ssm:DeleteDocument
                  - ssm:DescribeDocument
                  - ssm:GetDocument
                  - ssm:ListDocumentVersions
                Resource: arn:aws:ssm:us-east-1:594552273052:document/hive-v2-t01-teamkimi-port-forward
              - Sid: T01EvidenceBucketLifecycle
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutEncryptionConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:PutBucketOwnershipControls
                  - s3:PutBucketPublicAccessBlock
                Resource:
                  - arn:aws:s3:::hive-v2-t01-evidence-594552273052
                  - arn:aws:s3:::hive-v2-t01-evidence-594552273052/*
              - Sid: CloudFormationSelfDeploy
                Effect: Allow
                # the complete action set of a changeset-based
                # `aws cloudformation deploy` against an existing stack
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ContinueUpdateRollback
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: arn:aws:cloudformation:us-east-1:594552273052:stack/hive-v2-infra/*
              - Sid: ManageHiveRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:UpdateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource: arn:aws:iam::594552273052:role/hive-v2-*
              - Sid: UpdateHiveRoleDescriptions
                Effect: Allow
                Action: iam:UpdateRoleDescription
                Resource:
                  - arn:aws:iam::594552273052:role/hive-v2-gh-deploy
                  - arn:aws:iam::594552273052:role/hive-v2-gh-t01-smoke
              - Sid: ManageHiveBoundaryPolicies
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:SetDefaultPolicyVersion
                Resource:
                  - arn:aws:iam::594552273052:policy/hive-v2-t01-smoke-health-boundary
              # The fleet-wide deploy mutex lives in citadel's nexus stack;
              # the workflow acquires it before the SSM box deploy.
              - Sid: DeployMutex
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:us-east-1:594552273052:table/citadel-deploy-mutex

  BenchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-gh-bench
      Description: Assumed by the Torbhub/hive-v2 bench workflow via GitHub OIDC. Port-forward only.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub '${GithubSubjectPrefix}:*'
      Policies:
        - PolicyName: hive-v2-bench
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SsmPortForwardToKimiBox
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Role: nexus-kimi-session
              - Sid: SsmPortForwardingDocument
                Effect: Allow
                Action: ssm:StartSession
                Resource: arn:aws:ssm:us-east-1::document/AWS-StartPortForwardingSession

  T01EvidenceBucket:
    Metadata:
      com.aws.cloudformation.Context:
        why: short-lived external collection of sanitized T01 manifests and scenario evidence
        must:
          - Deny public access and encrypt objects
          - Expire objects after seven days
    DependsOn: DeployRole
    Type: AWS::S3::Bucket
    Properties:
      BucketName: hive-v2-t01-evidence-594552273052
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSanitizedEvidenceAfterSevenDays
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Role
          Value: hive-v2-t01-smoke

  T01TeamKimiPortForwardDocument:
    Metadata:
      com.aws.cloudformation.Context:
        why: fixed loopback port forwarding to the existing tagged TeamKimi host
        must:
          - Forward only local port 8765 to host port 8765
          - Open no public listener and run no shell command
    DependsOn: DeployRole
    Type: AWS::SSM::Document
    Properties:
      Name: hive-v2-t01-teamkimi-port-forward
      DocumentType: Session
      DocumentFormat: YAML
      Content:
        schemaVersion: '1.0'
        description: Fixed T01 loopback forwarding to the TeamKimi smoke listener.
        sessionType: Port
        properties:
          portNumber: '8765'
          type: LocalPortForwarding
          localPortNumber: '8765'

  T01SmokeHealthBoundary:
    Metadata:
      com.aws.cloudformation.Context:
        why: root-owned immutable boundary for the disposable instance role
        must:
          - Allow only run-scoped secret reads, evidence writes, and the fixed TeamKimi tunnel
    DependsOn: DeployRole
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: hive-v2-t01-smoke-health-boundary
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:594552273052:secret:hive-v2-t01-smoke-health-*
          - Sid: ReadRunTeamKimiControlKey
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:us-east-1:594552273052:secret:hive-v2-t01-smoke-proxy-*
          - Effect: Allow
            Action: s3:PutObject
            Resource: arn:aws:s3:::hive-v2-t01-evidence-594552273052/hive-v2-t01-smoke/*
          - Effect: Allow
            Action: ssm:StartSession
            Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
            Condition:
              StringEquals:
                ssm:resourceTag/Role: nexus-kimi-session
          - Effect: Allow
            Action: ssm:StartSession
            Resource: arn:aws:ssm:us-east-1:594552273052:document/hive-v2-t01-teamkimi-port-forward

  T01SmokeRole:
    Metadata:
      com.aws.cloudformation.Context:
        why: protected main-only dispatch owns the disposable preflight stack and run health credential
        must:
          - Create tags only during RunInstances or CreateSecurityGroup
          - Operate on existing resources only when they carry the T01 role tag
          - Limit health resources and credentials to their exact run-scoped names
          - Renew and release only the same owner's fleet mutex
    DependsOn: DeployRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: hive-v2-gh-t01-smoke
      Description: Manages only the disposable T01 preflight stack from the protected GitHub environment.
      MaxSessionDuration: 9000
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:sub: !Sub '${GithubSubjectPrefix}:environment:t01-smoke'
      Policies:
        - PolicyName: hive-v2-t01-smoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: T01SmokeCloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: arn:aws:cloudformation:us-east-1:594552273052:stack/hive-v2-t01-smoke/*
              - Sid: T01SmokeValidateTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: T01SmokeRunTaggedInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Role: hive-v2-t01-smoke
              - Sid: T01SmokeRunInstanceNetwork
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - arn:aws:ec2:us-east-1:594552273052:network-interface/*
                  - arn:aws:ec2:us-east-1:594552273052:volume/*
                  - arn:aws:ec2:us-east-1:594552273052:security-group/*
                  - arn:aws:ec2:us-east-1:594552273052:subnet/*
                  - arn:aws:ec2:us-east-1::image/*
              - Sid: T01SmokeCreateSecurityGroup
                Effect: Allow
                Action: ec2:CreateSecurityGroup
                Resource:
                  - arn:aws:ec2:us-east-1:594552273052:security-group/*
                  - arn:aws:ec2:us-east-1:594552273052:vpc/*
              - Sid: T01SmokeTagOnRunInstances
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - arn:aws:ec2:us-east-1:594552273052:instance/*
                  - arn:aws:ec2:us-east-1:594552273052:volume/*
                  - arn:aws:ec2:us-east-1:594552273052:network-interface/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Role: hive-v2-t01-smoke
                    ec2:CreateAction: RunInstances
              - Sid: T01SmokeTagOnSecurityGroup
                Effect: Allow
                Action: ec2:CreateTags
                Resource: arn:aws:ec2:us-east-1:594552273052:security-group/*
                Condition:
                  StringEquals:
                    aws:RequestTag/Role: hive-v2-t01-smoke
                    ec2:CreateAction: CreateSecurityGroup
              - Sid: T01SmokeManageInstances
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:GetConsoleOutput
                Resource: arn:aws:ec2:us-east-1:594552273052:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Role: hive-v2-t01-smoke
              - Sid: T01SmokeDeleteSecurityGroup
                Effect: Allow
                Action: ec2:DeleteSecurityGroup
                Resource: arn:aws:ec2:us-east-1:594552273052:security-group/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Role: hive-v2-t01-smoke
              - Sid: T01SmokeManageSecurityGroupEgress
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                Resource: arn:aws:ec2:us-east-1:594552273052:security-group/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Role: hive-v2-t01-smoke
              - Sid: T01SmokeReadEc2
                Effect: Allow
                Action: ec2:Describe*
                Resource: '*'
              - Sid: T01SmokeCreateInstanceRole
                Effect: Allow
                Action: iam:CreateRole
                Resource: arn:aws:iam::594552273052:role/hive-v2-t01-smoke-instance
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: arn:aws:iam::594552273052:policy/hive-v2-t01-smoke-health-boundary
              - Sid: T01SmokeManageInstanceIdentity
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:GetInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - arn:aws:iam::594552273052:role/hive-v2-t01-smoke-instance
                  - arn:aws:iam::594552273052:instance-profile/hive-v2-t01-smoke
              - Sid: T01SmokeUpdateInstanceBoundary
                Effect: Allow
                Action: iam:PutRolePermissionsBoundary
                Resource: arn:aws:iam::594552273052:role/hive-v2-t01-smoke-instance
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: arn:aws:iam::594552273052:policy/hive-v2-t01-smoke-health-boundary
              - Sid: T01SmokePassInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: arn:aws:iam::594552273052:role/hive-v2-t01-smoke-instance
                Condition:
                  StringEquals:
                    iam:PassedToService: ec2.amazonaws.com
              - Sid: T01HealthCredentialLifecycle
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                Resource: arn:aws:secretsmanager:us-east-1:594552273052:secret:hive-v2-t01-smoke-health-*
              - Sid: T01ProxyCredentialLifecycle
                Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:DescribeSecret
                  - secretsmanager:DeleteSecret
                Resource: arn:aws:secretsmanager:us-east-1:594552273052:secret:hive-v2-t01-smoke-proxy-*
              - Sid: T01PaidEvidenceReadback
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: arn:aws:s3:::hive-v2-t01-evidence-594552273052/hive-v2-t01-smoke/*
              - Sid: T01PaidEvidenceListing
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::hive-v2-t01-evidence-594552273052
                Condition:
                  StringLike:
                    s3:prefix: hive-v2-t01-smoke/*
              - Sid: T01SmokeDeployMutex
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: arn:aws:dynamodb:us-east-1:594552273052:table/citadel-deploy-mutex

Outputs:

  DeployRoleArn:
    Description: ARN the GitHub workflow assumes (set as secret HIVE_DEPLOY_ROLE_ARN).
    Value: !GetAtt DeployRole.Arn
  BenchRoleArn:
    Description: ARN the bench workflow assumes (set as secret HIVE_BENCH_ROLE_ARN).
    Value: !GetAtt BenchRole.Arn
  T01SmokeRoleArn:
    Description: ARN the protected t01-smoke environment assumes (set as secret HIVE_T01_SMOKE_ROLE_ARN).
    Value: !GetAtt T01SmokeRole.Arn
